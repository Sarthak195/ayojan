name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Tests run offline by design: there is no API key in this workflow and there must never be one.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the repository size check must see every object, and a shallow
          # clone would report a reassuring but meaningless number.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Validate the planning data
        run: npm run validate

      # One run both tests and measures src/core coverage, so the suite is not run twice.
      - name: Test with coverage
        run: npm run coverage

      - name: Enforce the 250-line file cap
        run: npm run check:size

      - name: Check for forbidden patterns and leaked keys
        run: npm run check:api

      - name: Check repository size against the contest limit
        run: npm run check:repo

      - name: Build
        run: npm run build
