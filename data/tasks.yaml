# Task templates for the timeline. Day counts only, no prices.
# latestFinishDaysBefore: the task should be finished this many days before the event.
# durationDays: working days the task takes once started.
# dependsOn: tasks that must finish first (a dependency on an inactive task counts as satisfied).
# activatedBy: the task is in the plan when any one condition holds.
# books: marking this task done with an amount books this category (the one booking path).
# fasterAlternative: what the task becomes when a lever chooses the quicker route.
# weddingOnly: dropped for the small-celebration profile.
# celebration: the small-celebration profile's own two day counts, with their basis (null only
#   on a wedding-only task). A birthday is planned days or weeks ahead, not months, so the wedding's
#   lead times would show every task Late. Its reviewed field is empty: nobody has reviewed it yet.

thresholds:
  atRiskSlackDays:
    en: At risk when a task has less than this many days of slack
    hi: इतने दिन से कम की गुंजाइश बचे तो काम ख़तरे में है
    days: 14
    basis: 'Planning assumption chosen by the author: two weeks of slack is the least that absorbs one vendor delay without touching the date.'
    reviewed: "2026-10-26 AI-assisted review at the author's request"
  dueSoonDays:
    en: Due this week when the latest start is this many days away or fewer
    hi: शुरू करने की आख़िरी तारीख़ इतने दिन के अंदर हो तो इसी हफ़्ते करना है
    days: 7
    basis: 'Planning assumption chosen by the author: a week is how far ahead a family looks when deciding what to do next.'
    reviewed: "2026-10-26 AI-assisted review at the author's request"

