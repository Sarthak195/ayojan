# Trade-off levers offered when the plan is over budget. Nothing is ever selected for the family.
# percentOfCategory: saves this percent of the category's projected amount (a planning assumption, ask your vendor).
# halfContingency and raiseBudget are exact arithmetic on the plan, not assumptions.
# mustHaveConflicts: the lever is disabled when the family named one of these as a must-have.
# fasterAlternativeFor: choosing the lever switches that task to its faster alternative.
# basisHi: the basis in Hindi, AI-written on 2026-10-28 and not reviewed by a person; the reviewed line does not cover it.

levers:
  - id: simpler-decor
    effect: percentOfCategory
    category: decor
    percent: 30
    provenance: assumption
    fasterAlternativeFor: null
    mustHaveConflicts: []
    en: Simpler decor
    hi: सादी सजावट
    consequence:
      en: Fewer flowers and lights, and a plainer stage.
      hi: फूल और लाइटें कम होंगी, और स्टेज सादा रहेगा।
    basis: 'Planning assumption chosen by the author: dropping fresh-flower walls and extra lighting removes roughly a third of a decor plan.'
    basisHi: 'योजना के लिए लेखक का चुना हुआ अनुमान: ताज़े फूलों की दीवारें और ज़्यादा लाइटें हटाने से सजावट का लगभग एक तिहाई ख़र्च कम हो जाता है।'
    reviewed: "2026-10-26 AI-assisted review at the author's request"

  - id: e-invites
    effect: percentOfCategory
    category: invites
    percent: 40
    provenance: assumption
    fasterAlternativeFor: print-invitations
    mustHaveConflicts: []
    en: E-invites and simpler return gifts
    hi: ई-कार्ड और सादे रिटर्न गिफ़्ट
    consequence:
      en: No printed cards, and a smaller gift for each family.
      hi: छपे कार्ड नहीं होंगे, और हर परिवार को छोटा गिफ़्ट मिलेगा।
    basis: 'Planning assumption chosen by the author: skipping printing and choosing a smaller gift removes a large part of this category.'
    basisHi: 'योजना के लिए लेखक का चुना हुआ अनुमान: कार्ड न छपवाने और छोटा गिफ़्ट चुनने से इस हिस्से का बड़ा भाग कम हो जाता है।'
    reviewed: "2026-10-26 AI-assisted review at the author's request"

  - id: leaner-photo
    effect: percentOfCategory
    category: photo
    percent: 25
    provenance: assumption
    fasterAlternativeFor: null
    mustHaveConflicts: []
    en: Leaner photo and video
    hi: छोटा फ़ोटो-वीडियो पैकेज
    consequence:
      en: One camera crew instead of two, and no drone or long film.
      hi: दो की जगह एक कैमरा टीम, और ड्रोन या लंबी फ़िल्म नहीं।
    basis: 'Planning assumption chosen by the author: one crew instead of two and no extras cuts about a quarter of a photo package.'
    basisHi: 'योजना के लिए लेखक का चुना हुआ अनुमान: दो की जगह एक टीम रखने और ड्रोन जैसी अतिरिक्त चीज़ें छोड़ने से फ़ोटो पैकेज का लगभग एक चौथाई ख़र्च कम हो जाता है।'
    reviewed: "2026-10-26 AI-assisted review at the author's request"

  - id: simpler-menu
    effect: percentOfCategory
    category: catering
    percent: 15
    provenance: assumption
    fasterAlternativeFor: null
    mustHaveConflicts: [liveCounter]
    en: Simpler menu
    hi: सादा मेन्यू
    consequence:
      en: Fewer dishes and starters, and no extra counters.
      hi: पकवान और स्टार्टर कम होंगे, और अलग काउंटर नहीं होंगे।
    basis: 'Planning assumption chosen by the author: fewer dishes trims a per-plate rate only modestly, because the base meal stays.'
    basisHi: 'योजना के लिए लेखक का चुना हुआ अनुमान: पकवान कम करने से प्रति प्लेट दाम थोड़ा ही घटता है, क्योंकि मुख्य खाना वही रहता है।'
    reviewed: "2026-10-26 AI-assisted review at the author's request"

  - id: smaller-band
    effect: percentOfCategory
    category: music
    percent: 50
    provenance: assumption
    fasterAlternativeFor: null
    mustHaveConflicts: [dhol]
    en: Smaller band
    hi: छोटा बैंड
    consequence:
      en: A smaller band or DJ booking, with fewer players and hours.
      hi: छोटा बैंड या DJ, कम बजाने वाले और कम घंटे।
    basis: 'Planning assumption chosen by the author: halving players and hours roughly halves a band booking.'
    basisHi: 'योजना के लिए लेखक का चुना हुआ अनुमान: बजाने वाले और घंटे आधे करने से बैंड का ख़र्च लगभग आधा हो जाता है।'
    reviewed: "2026-10-26 AI-assisted review at the author's request"

  - id: half-contingency
    effect: halfContingency
    category: contingency
    provenance: exact
    mustHaveConflicts: []
    en: Use half the contingency
    hi: अचानक के ख़र्च की आधी रक़म इस्तेमाल करें
    consequence:
      en: Less money held back for surprises on the day.
      hi: आयोजन के दिन अचानक के ख़र्च के लिए कम पैसे बचेंगे।
    basis: 'Planning assumption chosen by the author: half the reserve is the most that can be spent while still keeping some cover.'
    basisHi: 'योजना के लिए लेखक का चुना हुआ अनुमान: कमी पूरी करने के लिए अचानक के ख़र्च वाली रक़म में से ज़्यादा से ज़्यादा आधी ही ली जा सकती है, ताकि कुछ सहारा बचा रहे।'
    reviewed: "2026-10-26 AI-assisted review at the author's request"

  - id: raise-budget
    effect: raiseBudget
    provenance: exact
    mustHaveConflicts: []
    en: Raise the budget to cover the gap
    hi: कमी पूरी करने के लिए बजट बढ़ाएँ
    consequence:
      en: The family spends more than first planned.
      hi: परिवार पहले सोचे गए बजट से ज़्यादा ख़र्च करेगा।
    basis: 'Planning assumption chosen by the author: raising the budget by exactly the gap is always an honest option to show.'
    basisHi: 'योजना के लिए लेखक का चुना हुआ अनुमान: बजट को ठीक उतना बढ़ाना जितना पैसा कम पड़ रहा है, हमेशा दिखाने लायक एक ईमानदार विकल्प है।'
    reviewed: "2026-10-26 AI-assisted review at the author's request"
