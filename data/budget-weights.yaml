# Budget split: proportions of the user's own budget, never prices.
# baseWeight: relative share before priorities (weights are normalised, so they need not sum to 100).
# perGuestSharePercent: how much of the category grows with the guest count (100 = fully, 0 = not at all).
# floor: how far Move money may take the category down (share of its own frozen allocation, or of the budget).
# occasions: the occasions that use the profile; every occasion appears in exactly one profile.
# multipliers: applied to baseWeight by the priority the family chose, then everything is normalised again.
# reviewed: empty until the user signs the row off; until then the app calls these unreviewed planning assumptions.

multipliers:
  - priority: more
    en: Invest more
    hi: ज़्यादा ख़र्च करें
    percent: 125
    basis: 'Planning assumption chosen by the author: a quarter more weight is a visible shift without starving the other categories.'
    reviewed: ''
  - priority: standard
    en: Standard
    hi: सामान्य
    percent: 100
    basis: 'Planning assumption chosen by the author: standard leaves the base weight unchanged.'
    reviewed: ''
  - priority: save
    en: Save here
    hi: यहाँ बचत करें
    percent: 70
    basis: 'Planning assumption chosen by the author: about a third less weight is a real saving while the category still gets done.'
    reviewed: ''
  - priority: unclear
    en: Not sure yet
    hi: अभी तय नहीं
    percent: 100
    basis: 'Planning assumption chosen by the author: an unanswered priority is treated as standard, never as a choice the family did not make.'
    reviewed: ''

profiles:
  - id: wedding
    occasions: [wedding]
    en: Wedding
    hi: शादी
    basis: 'Planning assumption chosen by the author: food is usually the largest share of a family wedding and the venue the second.'
    reviewed: ''
    categories:
      - category: venue
        en: Venue
        hi: वेन्यू
        baseWeight: 22
        perGuestSharePercent: 30
        floor: { of: allocation, percent: 50 }
        basis: 'Planning assumption chosen by the author: the venue is the second largest share and only partly grows with guests, since a hall is booked whole.'
        reviewed: ''
      - category: catering
        en: Catering
        hi: खाना-पीना
        baseWeight: 35
        perGuestSharePercent: 100
        floor: { of: allocation, percent: 50 }
        basis: 'Planning assumption chosen by the author: food is the largest share and is priced per plate, so it grows fully with guests.'
        reviewed: ''
      - category: decor
        en: Decor
        hi: सजावट
        baseWeight: 10
        perGuestSharePercent: 20
        floor: { of: allocation, percent: 50 }
        basis: 'Planning assumption chosen by the author: decor is a mid-sized share that grows a little with more tables and seating.'
        reviewed: ''
      - category: photo
        en: Photo and video
        hi: फ़ोटो और वीडियो
        baseWeight: 10
        perGuestSharePercent: 0
        floor: { of: allocation, percent: 50 }
        basis: 'Planning assumption chosen by the author: photography is priced by the day and crew, not by the number of guests.'
        reviewed: ''
      - category: music
        en: Music and baraat
        hi: संगीत और बारात
        baseWeight: 6
        perGuestSharePercent: 0
        floor: { of: allocation, percent: 50 }
        basis: 'Planning assumption chosen by the author: a band or dhol is booked for the event, so it does not grow with guests.'
        reviewed: ''
      - category: invites
        en: Invitations and return gifts
        hi: न्योते और रिटर्न गिफ़्ट
        baseWeight: 7
        perGuestSharePercent: 100
        floor: { of: allocation, percent: 50 }
        basis: 'Planning assumption chosen by the author: one card and one gift per invited family, so the share grows fully with guests.'
        reviewed: ''
      - category: contingency
        en: Contingency
        hi: अचानक के ख़र्च
        baseWeight: 10
        perGuestSharePercent: 0
        floor: { of: budget, percent: 5 }
        basis: 'Planning assumption chosen by the author: a tenth held back absorbs surprises, and at least a twentieth of the budget always stays in reserve.'
        reviewed: ''

  - id: celebration
    occasions: [birthday, anniversary, puja, communityEvent, other]
    en: Small celebration
    hi: छोटा समारोह
    basis: 'Planning assumption chosen by the author: at a birthday, anniversary, puja or community event food is an even larger share and photos a smaller one than at a wedding.'
    reviewed: ''
    categories:
      - category: venue
        en: Venue or hall
        hi: वेन्यू या हॉल
        baseWeight: 20
        perGuestSharePercent: 30
        floor: { of: allocation, percent: 50 }
        basis: 'Planning assumption chosen by the author: a hall or home terrace is the second largest share and only partly grows with guests.'
        reviewed: ''
      - category: catering
        en: Food and drinks
        hi: खाना-पीना
        baseWeight: 40
        perGuestSharePercent: 100
        floor: { of: allocation, percent: 50 }
        basis: 'Planning assumption chosen by the author: at a small celebration food is most of the cost and grows fully with guests.'
        reviewed: ''
      - category: decor
        en: Decor
        hi: सजावट
        baseWeight: 12
        perGuestSharePercent: 20
        floor: { of: allocation, percent: 50 }
        basis: 'Planning assumption chosen by the author: balloons, a backdrop and a cake table make decor a slightly larger share than at a wedding.'
        reviewed: ''
      - category: photo
        en: Photos
        hi: फ़ोटो
        baseWeight: 6
        perGuestSharePercent: 0
        floor: { of: allocation, percent: 50 }
        basis: 'Planning assumption chosen by the author: one photographer for a few hours is a small share that does not grow with guests.'
        reviewed: ''
      - category: music
        en: Music and entertainment
        hi: संगीत और मनोरंजन
        baseWeight: 6
        perGuestSharePercent: 0
        floor: { of: allocation, percent: 50 }
        basis: 'Planning assumption chosen by the author: a DJ, magician or games host is booked for the event, not per guest.'
        reviewed: ''
      - category: invites
        en: Invitations and return gifts
        hi: न्योते और रिटर्न गिफ़्ट
        baseWeight: 6
        perGuestSharePercent: 100
        floor: { of: allocation, percent: 50 }
        basis: 'Planning assumption chosen by the author: invitations are mostly digital at a small celebration, so the share is mainly return gifts.'
        reviewed: ''
      - category: contingency
        en: Contingency
        hi: अचानक के ख़र्च
        baseWeight: 10
        perGuestSharePercent: 0
        floor: { of: budget, percent: 5 }
        basis: 'Planning assumption chosen by the author: the same reserve as a wedding, because surprises do not shrink with the event.'
        reviewed: ''
